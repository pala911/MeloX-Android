name: One-time Debug APK

on:
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          echo "== installed platforms =="
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          echo "== platform packages offered by sdkmanager =="
          sdkmanager --list 2>/dev/null | grep -E 'platforms;android-3[5-9]' || true
          echo "== build-tools packages offered by sdkmanager =="
          sdkmanager --list 2>/dev/null | grep -E 'build-tools;3[4-9]' || true
          # Keep going when the runner's sdkmanager does not offer API 37: the
          # project sets android.builder.sdkDownload=true, so AGP can still
          # resolve the compile SDK through its own downloader.
          sdkmanager "platforms;android-37" "build-tools;35.0.0" || echo "SKIP: platforms;android-37 unavailable here, letting AGP resolve it"

      # A fresh debug keystore on every run means `adb install -r` fails with a
      # signature mismatch, so each update would wipe the app's data. Cache the
      # generated one so every build after the first shares a signature.
      - name: Reuse a stable debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: melox-android-debug-keystore-v1

      - name: Ensure debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -l ~/.android/debug.keystore

      - name: Assemble Debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --max-workers=2 --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MeloX-Android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
